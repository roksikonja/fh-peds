repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: ['--fix']
        files: ^ml-fh-peds/.*\.py$
      - id: ruff-format
        files: ^ml-fh-peds/.*\.py$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, html, css, json, markdown, yaml]
        additional_dependencies:
          - prettier@3.3.3
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.13.0
    hooks:
      - id: eslint
        files: \.js$
        types: [file]
        additional_dependencies:
          - eslint@9.13.0
          - '@eslint/js@9.13.0'
          - globals@15.11.0
  - repo: local
    hooks:
      - id: website-tests
        name: website-tests (Astro build + JS inference)
        entry: bash -c 'npm run build && MODEL_DIR="$PWD/data/models/20260331_220132" node ml-fh-peds/tests/test_inference.js'
        language: system
        stages: [manual]
        pass_filenames: false
      - id: ml-tests
        name: ml-tests (pytest)
        entry: bash -c 'cd ml-fh-peds && uv sync --extra test --frozen && MODEL_DIR="$PWD/../data/models/20260331_220132" uv run pytest -q'
        language: system
        stages: [manual]
        pass_filenames: false
