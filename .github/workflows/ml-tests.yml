name: ml-tests
on:
  push:
    branches: ['**']
    paths:
      - 'ml-fh-peds/**'
      - '.github/workflows/ml-tests.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'ml-fh-peds/**'
      - '.github/workflows/ml-tests.yml'
concurrency:
  group: ml-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml-fh-peds
    env:
      MODEL_DIR: ${{ github.workspace }}/data/models/20260331_220132
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: ml-fh-peds/uv.lock
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --extra test --frozen
      - name: Run pytest
        run: uv run pytest -q
