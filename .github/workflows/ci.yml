name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel in-progress runs for the same ref to save compute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml-fh-peds
    env:
      MODEL_DIR: ${{ github.workspace }}/models/20260331_220132
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: ml-fh-peds/uv.lock

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra test --frozen

      - name: Run pytest
        run: uv run pytest -q

  js-tests:
    name: JS inference tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODEL_DIR: ${{ github.workspace }}/models/20260331_220132
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the sitar::uk90 reference file across CI runs. Cache key is
      # derived from the loader source (which encodes the pinned sitar commit
      # SHA and expected SHA-256), so any change to the pin invalidates it.
      - name: Cache sitar::uk90 reference
        uses: actions/cache@v4
        with:
          path: ml-fh-peds/tests/.cache/uk90.rda
          key: sitar-uk90-${{ hashFiles('ml-fh-peds/tests/uk90_rda_loader.js') }}

      - name: Run JS inference tests
        run: node ml-fh-peds/tests/test_inference.js
