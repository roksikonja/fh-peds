name: website-lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: website-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: prettier + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: npm run format:check

      - name: Run eslint
        run: npm run lint
